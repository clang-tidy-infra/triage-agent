name: Triage new clang-tidy issues

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      since-days:
        description: 'Only consider LLVM issues created within this many days'
        required: false
        default: '7'
      cap:
        description: 'Maximum number of issues to triage in this run'
        required: false
        default: '1'
      agent-backend:
        description: 'Which AI agent to use for analysis'
        required: false
        type: choice
        options:
          - claude
          - cursor
        default: 'claude'
      issue-number:
        description: 'Triage this specific LLVM issue number only, skipping discover/dedup'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  discover:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/discover-issues.yaml
    with:
      mode: 'recent'
      since-days: ${{ inputs.since-days || '7' }}
      cap: ${{ inputs.cap || '1' }}
      issue-number: ${{ inputs.issue-number || '' }}

  triage:
    needs: discover
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/triage-analysis.yaml
    with:
      issues: ${{ needs.discover.outputs.issues }}
      agent-backend: ${{ inputs.agent-backend || 'claude' }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      cursor-api-key: ${{ secrets.CURSOR_API_KEY }}
