name: Triage new clang-tidy issues

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      since-days:
        description: 'Only consider LLVM issues created within this many days'
        required: false
        default: '7'
      cap:
        description: 'Maximum number of issues to triage in this run'
        required: false
        default: '1'
      agent-backend:
        description: 'Which AI agent to use for analysis'
        required: false
        type: choice
        options:
          - claude
          - cursor
        default: 'claude'
      issue-number:
        description: 'Triage this specific LLVM issue number only, skipping discover/dedup'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  discover:
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      issues: ${{ steps.discover.outputs.issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install triage-agent
        run: pip install -e .

      - name: Find new clang-tidy issues
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE_DAYS: ${{ inputs.since-days || '7' }}
          CAP: ${{ inputs.cap || '1' }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "issue-number must be a positive integer, got: $ISSUE_NUMBER" >&2
              exit 1
            fi
            echo "Skipping discover/dedup: triaging issue #$ISSUE_NUMBER directly"
            issues="[$ISSUE_NUMBER]"
          else
            issues=$(triage-agent discover --since-days "$SINCE_DAYS" --cap "$CAP")
          fi
          echo "issues=$issues" >> "$GITHUB_OUTPUT"

  triage:
    needs: discover
    if: needs.discover.outputs.issues != '[]'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        issue: ${{ fromJson(needs.discover.outputs.issues) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ matrix.issue }}
      AGENT_BACKEND: ${{ inputs.agent-backend || 'claude' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install triage-agent
        run: pip install -e .

      - name: Generate report template
        run: triage-agent report-template --issue-number "$ISSUE_NUMBER" --output report.md

      - name: Checkout clang-tidy source, docs, and tests from LLVM
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/llvm/llvm-project.git llvm-project
          git -C llvm-project sparse-checkout set clang-tools-extra

      - name: Set up Node.js
        if: env.AGENT_BACKEND == 'claude'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        if: env.AGENT_BACKEND == 'claude'
        run: npm install -g @anthropic-ai/claude-code@2.1.233

      - name: Analyze issue with Claude Code
        if: env.AGENT_BACKEND == 'claude'
        continue-on-error: true
        timeout-minutes: 20
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          claude -p "report.md is pre-filled for one LLVM clang-tidy \
          issue. Fill in the TBD fields in the Analysis section in place, \
          using godbolt.py to reproduce. Do not touch the Source section. \
          Follow AGENTS.md." \
          --allowedTools "Bash,Read,Edit" \
          --model claude-sonnet-5 \
          --output-format stream-json \
          --verbose \
          --include-partial-messages \
          | tee claude-output.jsonl | jq -C '.'

      - name: Extract agent summary
        if: env.AGENT_BACKEND == 'claude'
        run: |
          if [ -f claude-output.jsonl ]; then
            jq -r 'select(.type == "result") | .result' claude-output.jsonl \
              > agent-summary.txt || true
          fi

      - name: Install Cursor CLI
        if: env.AGENT_BACKEND == 'cursor'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Analyze issue with Cursor agent
        if: env.AGENT_BACKEND == 'cursor'
        continue-on-error: true
        timeout-minutes: 20
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          agent --trust -p "report.md is pre-filled for one LLVM clang-tidy \
          issue. Fill in the TBD fields in the Analysis section in place, \
          using godbolt.py to reproduce. Do not touch the Source section. \
          Follow AGENTS.md." \
          --model cursor-grok-4.6-high

      - name: Upload report for debugging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-${{ matrix.issue }}
          path: |
            report.md
            agent-summary.txt

      - name: Create tracking issue
        run: >
          triage-agent create-tracking-issue --issue-number "$ISSUE_NUMBER"
          --report-file report.md --agent-summary-file agent-summary.txt
